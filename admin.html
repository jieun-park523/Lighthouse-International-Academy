<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Admin Page</title>

  <style>

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #f5f5f5;

    }

    header {

      background: #1b5e20;

      color: white;

      padding: 20px;

      text-align: center;

    }

    .container {

      max-width: 900px;

      margin: 40px auto;

      padding: 20px;

    }

    .card {

      background: white;

      padding: 25px;

      border-radius: 15px;

      margin-bottom: 20px;

      box-shadow:
        0 5px 15px rgba(0,0,0,0.1);

    }

    h2 {

      margin-top: 0;

    }

    button {

      background: #2e7d32;

      color: white;

      border: none;

      padding: 12px 20px;

      border-radius: 8px;

      cursor: pointer;

      transition: 0.3s;

    }

    button:hover {

      background: #1b5e20;

    }

    #user-email {

      color: #2e7d32;

      font-weight: bold;

    }

    .logout-btn {

      background: crimson;

    }

    .logout-btn:hover {

      background: darkred;

    }

  </style>

</head>

<body>

<header>

  <h1>관리자 페이지</h1>

</header>


<div class="container">

  <div class="card">

    <h2>관리자 정보</h2>

    <p>

      로그인 계정:

      <span id="user-email"></span>

    </p>

    <button
      class="logout-btn"
      onclick="logout()"
    >

      로그아웃

    </button>

  </div>


  <div class="card">

    <h2>관리자 기능</h2>

    <p>

      여기에 공지 작성 /
      사진 업로드 등을
      추가 가능 😎

    </p>

    <button>

      공지 작성

    </button>

  </div>

</div>


<script type="module">

import { createClient }

from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

//////////////////////////////////////
// 🔥 Supabase import

import { createClient }
from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'


//////////////////////////////////////
// 🔥 Supabase 설정

const supabaseUrl =
'https://czpatsellvgtpvfqduek.supabase.co'

const supabaseKey =
'YOUR_ANON_KEY'

const supabase =
createClient(
  supabaseUrl,
  supabaseKey
)


//////////////////////////////////////
// 🔥 로그인 확인

const {
  data: { user }
} = await supabase.auth.getUser()


// 로그인 안 했으면
if (!user) {

  window.location.href =
    "login.html"

}


// 관리자 아니면 차단
else if (

  user.email !==
  "jieunpark523@gmail.com"

) {

  alert("관리자만 접근 가능!")

  window.location.href =
    "index.html"

}


// 관리자면 이메일 표시
else {

  document.getElementById(
    "user-email"
  ).textContent = user.email

}


//////////////////////////////////////
// 🔥 로그아웃

window.logout = async function() {

  await supabase.auth.signOut()

  window.location.href =
    "login.html"

}

</script>

</body>
</html>
